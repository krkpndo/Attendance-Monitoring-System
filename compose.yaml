name: attendance-monitoring-system

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance_dev_password
      TZ: Asia/Manila
      PGTZ: Asia/Manila
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migrate:
    image: attendance-monitoring-system-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://attendance:attendance_dev_password@postgres:5432/attendance_db?schema=public
      FRONTEND_URL: http://localhost:5173
      PORT: "3000"
      NODE_ENV: development
      TZ: Asia/Manila
    command: npx prisma migrate deploy
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: attendance-monitoring-system-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://attendance:attendance_dev_password@postgres:5432/attendance_db?schema=public
      FRONTEND_URL: http://localhost:5173
      PORT: "3000"
      NODE_ENV: development
      TZ: Asia/Manila
    command: npm run dev
    init: true
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    image: attendance-monitoring-system-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: http://localhost:3000
      DEV_API_PROXY_TARGET: http://backend:3000
    command: npm run dev -- --host 0.0.0.0 --port 5173
    init: true
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  seed:
    profiles: ["tools"]
    image: attendance-monitoring-system-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://attendance:attendance_dev_password@postgres:5432/attendance_db?schema=public
      FRONTEND_URL: http://localhost:5173
      PORT: "3000"
      NODE_ENV: development
      TZ: Asia/Manila
      ALLOW_DESTRUCTIVE_SEED: ${ALLOW_DESTRUCTIVE_SEED:-}
    command: npx prisma db seed
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  backend_uploads:
